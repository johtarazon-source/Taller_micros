<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Iniciar Sesión - LeeSmart</title>
    <style>
        .seccion-autenticacion {
            min-height: calc(100vh - 200px);
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            position: relative;
            overflow: hidden;
        }

        /* Estantería de fondo */
        .biblioteca-fondo {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            opacity: 0.6;
        }

        .estanteria {
            position: relative;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            padding: 2rem;
        }

        .estantes-contenedor {
            background: linear-gradient(180deg, rgba(147, 112, 219, 0.4) 0%, rgba(75, 0, 130, 0.4) 100%);
            border-radius: 1.5rem;
            padding: 2rem;
            width: 100%;
            max-width: 900px;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.2);
        }

        .estante {
            display: flex;
            gap: 0.3rem;
            margin-bottom: 1rem;
            height: 60px;
            align-items: flex-end;
        }

        .libro {
            flex: 1;
            border-radius: 0.3rem;
            animation: float 6s ease-in-out infinite;
        }

        .libro:nth-child(1) { background: #FF6B6B; height: 50px; animation-delay: 0s; }
        .libro:nth-child(2) { background: #4ECDC4; height: 55px; animation-delay: 0.2s; }
        .libro:nth-child(3) { background: #FFE66D; height: 45px; animation-delay: 0.4s; }
        .libro:nth-child(4) { background: #95E1D3; height: 60px; animation-delay: 0.6s; }
        .libro:nth-child(5) { background: #F38181; height: 50px; animation-delay: 0.8s; }
        .libro:nth-child(6) { background: #AA96DA; height: 55px; animation-delay: 1s; }
        .libro:nth-child(7) { background: #FCBAD3; height: 48px; animation-delay: 1.2s; }
        .libro:nth-child(8) { background: #A8E6CF; height: 52px; animation-delay: 1.4s; }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-5px); }
        }

        /* Persona ilustrada */
        .persona-ilustrada {
            position: absolute;
            right: 2rem;
            bottom: 2rem;
            z-index: 2;
            font-size: 5rem;
        }

        /* Formulario superpuesto */
        .modal-formulario {
            position: relative;
            z-index: 10;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(20px);
            border-radius: 1.5rem;
            padding: 3rem;
            width: 100%;
            max-width: 450px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            border: 2px solid rgba(255, 255, 255, 0.9);
        }

        .modal-formulario h1 {
            color: #2c3e50;
            margin-bottom: 1.5rem;
            font-size: 1.8rem;
            text-align: center;
        }

        #login-form {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .grupo-formulario {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .grupo-formulario label {
            color: #34495e;
            font-weight: 600;
            font-size: 0.95rem;
        }

        .grupo-formulario input {
            padding: 0.8rem;
            border: 2px solid #ecf0f1;
            border-radius: 0.8rem;
            font-size: 1rem;
            transition: all 0.3s ease;
            background: rgba(255, 255, 255, 0.9);
        }

        .grupo-formulario input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
            background: rgba(255, 255, 255, 1);
        }

        .modal-formulario .boton-primario {
            padding: 1rem;
            font-size: 1rem;
            font-weight: 600;
            margin-top: 0.5rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            color: white;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .modal-formulario .boton-primario:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.4);
        }

        .enlace-autenticacion {
            text-align: center;
            color: #7f8c8d;
            margin-top: 1rem;
            font-size: 0.95rem;
        }

        .enlace-autenticacion a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: color 0.3s ease;
        }

        .enlace-autenticacion a:hover {
            color: #764ba2;
        }

        @media (max-width: 768px) {
            .seccion-autenticacion {
                min-height: auto;
                padding: 1rem;
            }

            .modal-formulario {
                padding: 2rem;
                max-width: 100%;
            }

            .persona-ilustrada {
                right: 1rem;
                bottom: 1rem;
                font-size: 3rem;
            }

            .estante {
                height: 40px;
            }

            .estantes-contenedor {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
    <header class="encabezado-sitio">
        <a href="index.html" class="marca" aria-label="Inicio">
            <svg class="logo-libro" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                <rect x="20" y="20" width="30" height="60" fill="#4A90E2" rx="3"/>
                <rect x="50" y="20" width="30" height="60" fill="#9B59B6" rx="3"/>
                <line x1="50" y1="20" x2="50" y2="80" stroke="#fff" stroke-width="2"/>
                <line x1="25" y1="35" x2="45" y2="35" stroke="#fff" stroke-width="1" opacity="0.7"/>
                <line x1="25" y1="45" x2="45" y2="45" stroke="#fff" stroke-width="1" opacity="0.7"/>
                <line x1="25" y1="55" x2="45" y2="55" stroke="#fff" stroke-width="1" opacity="0.7"/>
                <line x1="55" y1="35" x2="75" y2="35" stroke="#fff" stroke-width="1" opacity="0.7"/>
                <line x1="55" y1="45" x2="75" y2="45" stroke="#fff" stroke-width="1" opacity="0.7"/>
                <line x1="55" y1="55" x2="75" y2="55" stroke="#fff" stroke-width="1" opacity="0.7"/>
            </svg>
            <span class="marca-titulo">LeeSmart</span>
        </a>

        <nav class="navegacion-principal" aria-label="Principal">
            <ul class="enlaces-nav">
                <li><a href="index.html">Inicio</a></li>
                <li><a href="libros.html">Descubrir</a></li>
                <li><a href="generos.html">Géneros</a></li>
                <li><a href="biblioteca.html">Mi Biblioteca</a></li>
            </ul>
        </nav>

        <div class="acciones-encabezado">
            <span id="info-usuario" class="info-usuario"></span>
            <a href="login.html" id="enlace-login" class="boton boton-primario">Iniciar sesión</a>
            <a href="registro.html" id="enlace-registro" class="boton boton-secundario">Registrarse</a>
            <button id="boton-cerrar-sesion" class="boton boton-peligro" style="display: none;">Cerrar sesión</button>
        </div>
    </header>

    <main class="contenedor-principal">
        <section class="seccion-autenticacion">
            <!-- Fondo de biblioteca -->
            <div class="biblioteca-fondo">
                <div class="estanteria">
                    <div class="estantes-contenedor">
                        <div class="estante">
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                        </div>
                        <div class="estante">
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                        </div>
                        <div class="estante">
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                            <div class="libro"></div>
                        </div>
                    </div>
                </div>
                <div class="persona-ilustrada">👩‍💻</div>
            </div>

            <!-- Formulario superpuesto -->
            <div class="modal-formulario">
                <h1>Iniciar Sesión</h1>
                <form id="login-form">
                    <div class="grupo-formulario">
                        <label for="email">Correo electrónico:</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="grupo-formulario">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button type="submit" class="boton boton-primario boton-grande">Iniciar Sesión</button>
                </form>
                <p class="enlace-autenticacion">¿No tienes cuenta? <a href="registro.html">Registrarse</a></p>
            </div>
        </section>
    </main>

    <footer class="pie-sitio">
        <div class="contenido-footer">
            <p>&copy; 2025 LeeSmart - Plataforma de Lectura Digital</p>
        </div>
    </footer>

    <script src="js/modal.js"></script>
    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
