<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="estilos.css">
    <title>Iniciar Sesión - Gestor de Libros</title>
</head>
<body>
    <header class="site-header">
        <a href="index.html" class="brand" aria-label="Inicio">
            <img class="logo" src="https://images.vexels.com/media/users/3/229082/isolated/preview/6fabc24c3830d75486725cc6d786dfbb-logotipo-de-circulos-de-libro.png" alt="Logo">
        </a>
    </header>

    <main class="auth-container">
        <section class="auth-form">
            <h1>Iniciar Sesión</h1>
            <form id="login-form">
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <input type="password" id="password" name="password" required>
                </div>
                <button type="submit" class="btn btn-primary">Iniciar Sesión</button>
            </form>
            <p class="auth-link">¿No tienes cuenta? <a href="registro.html">Registrarse</a></p>
        </section>
    </main>

    <footer class="site-footer">
        <p>&copy; 2025 Gestor de Libros. Todos los derechos reservados.</p>
    </footer>

    <script src="js/api-client.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
